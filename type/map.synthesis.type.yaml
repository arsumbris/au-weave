#: A synthesis, an ARGUMENT SLICE, a woven argument over a cluster, the reader's or agent's reasoned entry point.
#: A woven-graph map over au-base-types `map`. A map is a SLICE woven INTO the graph, a cut along an axis, not a
#: layer above the notes. The synthesis's axis is an ARGUMENT, its body argues what a cluster MEANS along ONE axis
#: (a theme, a pipeline, a contrast), each link a reasoned link in the sentence that says why it belongs. A
#: chosen path through the cluster, not a dump, and not a directory. (A synthesis map's links ARE reasoned prose
#: edges, the case the-reasoned-edge's map carve-out does not cover.) Emergent, minted by tend at a squeeze point,
#: never per-source. NOT a directory: if the body orients and points rather than argues, that is `map.overview`.
#: FORMAT the body free-form, NO forced heading: one link per line, grouped by the axis, one blank line after
#: the frontmatter, plain and tight, screen-fit, built to be SCANNED.
#: The map judgment (a map is a slice, say why the notes belong, render honestly, rework a stale map) rides the
#: shared map guide in au-agent-guides, not here. The example bundle's synthesis preset; a domain may add its own.
extends: map::au-base-types
