#: A proposition stated as a fact, titled as a declarative phrase. The title IS the proposition, no aliases (aliases is entity-only).
#: A woven node over au-base-types `idea`, its body the GROUNDS, why the claim holds, from its sources.
#: Write the fact, then its grounds. Strip the speaker ("screen light delays sleep", never "the source says X").
#: If the belief itself is the point, name who holds it, grounded. Keep the claim's own hedge in its own wording,
#: sharpened no further than the evidence reaches, so it records the claim without judging its truth. Grounded IN
#: its sources (the grounds edge + free backlinks), not narrated FROM them. Every link in the sentence that says why,
#: no relation stronger than the sources show.
#: FORMAT the body free-form, NO forced heading: clean whitespace-separated paragraphs for a short claim, `##`
#: subheadings when the argument has distinct parts. One blank line after the frontmatter, then one sentence per line, plain and tight, screen-fit, the argument
#: not a dump, never a wall of text.
#: Standing and contradiction-resolution are downstream, not here.
#: Admission and distinction from concepts follow [[hold-only-what-the-web-uses]].
#: Support and tension follow [[the-argument-edge]].
#: Default new nodes to `claims/<claim itself>.md` unless the consumer supplies another convention.
#: Preserve existing node paths.
extends: idea::au-base-types
